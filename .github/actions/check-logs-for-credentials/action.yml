# Artifacts of this public repo are downloadable by anyone, and GitHub masks
# secrets only in the console output. Fail the job if any test log holds the
# password: in plaintext, URL-encoded, or inside a Basic auth header.
name: Check logs for credentials
description: Fail if the test logs contain the ClickHouse password
inputs:
  user:
    description: ClickHouse user the tests authenticate as
    default: default
  password:
    description: ClickHouse password the tests authenticate with
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CH_USER: ${{ inputs.user }}
        CH_PASSWORD: ${{ inputs.password }}
      run: |
        if [ -z "${CH_PASSWORD}" ]; then
          echo "::error::No password given, nothing to check for"
          exit 1
        fi
        patterns=(-e "${CH_PASSWORD}" -e "$(printf '%s:%s' "${CH_USER}" "${CH_PASSWORD}" | base64 -w0)")
        encoded=$(jq -rn --arg p "${CH_PASSWORD}" '$p | @uri')
        if [ "${encoded}" != "${CH_PASSWORD}" ]; then patterns+=(-e "${encoded}"); fi
        leaked=$({ find . -path '*/build/unit-tests.log' -type f -print0; [ -d log ] && find log -type f -print0; } \
          | xargs -0r grep -lF "${patterns[@]}" || true)
        if [ -n "${leaked}" ]; then
          echo "::error::Credentials leaked into test logs (failing the job; logs will not be uploaded):"
          echo "${leaked}"
          exit 1
        fi
